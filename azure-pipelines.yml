trigger:
  branches:
    include:
      - main
      - develop

pool:
  name: 'Local Pool'

steps:
  - task: UseNode@1
    inputs:
      version: '20.x'
    displayName: 'Instalar Node.js 20 LTS'

  - script: |
      npm ci
    displayName: 'Instalar Dependencias (npm ci)'

  - script: |
      npx playwright install --with-deps
    displayName: 'Instalar Navegadores de Playwright'

  - script: |
      npx playwright test
    displayName: 'Ejecutar Pruebas E2E de Playwright'

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/results.xml'
      failTaskOnFailedTests: true
    displayName: 'Publicar Resultados JUnit'

  - task: PublishPipelineArtifact@1
    condition: always()
    inputs:
      targetPath: 'playwright-report'
      artifact: 'PlaywrightReport'
      publishLocation: 'pipeline'
    displayName: 'Subir Reporte HTML y Capturas'